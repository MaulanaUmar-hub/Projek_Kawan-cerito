[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build",
  "php artisan config:clear",
  "php artisan route:clear",
  "php artisan view:clear"
]

[start]
cmd = "true && php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=$PORT || php artisan storage:link"